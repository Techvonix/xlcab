name: xlcab_core
description: "XLCAB — socle commun aux applications : client API, connexion, modèles, traductions."
publish_to: "none"
version: 1.0.0
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  intl: ^0.20.2
  # Photo (colis, documents) compressée sous 2 Mo
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  # Notifications push (services/push_service.dart) ; déjà résolues pour les deux applis.
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Traductions générées depuis lib/l10n/*.arb (voir l10n.yaml).
  generate: true
