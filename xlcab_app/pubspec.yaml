name: xlcab_app
description: "XLCAB — Navettes 7+ places. Trajets 60 km+. Colis inclus."
publish_to: "none"
version: 1.0.0+1

environment:
  # 3.27 minimum : le thème utilise Color.withValues et CardThemeData,
  # apparus dans Flutter 3.27 (Dart 3.6).
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  # Réseau & stockage
  dio: ^5.4.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3

  # Cartes & localisation
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0

  # Paiement
  flutter_stripe: ^11.1.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_messaging: ^15.0.4
  firebase_analytics: ^11.2.1
  firebase_crashlytics: ^4.0.4

  # Internationalisation (0.20 : version imposée par flutter_localizations)
  intl: ^0.20.2

  # UI / Animations
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8

  # QR code / scan colis
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Divers
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  socket_io_client: ^2.0.3+1
  # Onboarding chauffeur : photo des documents + compression sous 2 Mo
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  # Traductions générées depuis lib/l10n/*.arb (voir l10n.yaml).
  generate: true

  # Polices — Poppins (titres) + Inter (corps), voir Partie 5 design system
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
