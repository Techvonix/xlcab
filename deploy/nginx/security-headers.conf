# XLCAB — en-têtes de sécurité des portails web (Partie 8 : « TLS 1.3 + HSTS »).
# À inclure dans les blocs `server` de entreprise.xlcab.com et admin.xlcab.com :
#     include /etc/nginx/snippets/xlcab-security-headers.conf;
#
# La CSP limite l'exécution aux scripts servis par le portail lui-même : un
# script injecté (XSS) ne pourrait ni s'exécuter ni appeler un autre domaine.
# Les jetons sensibles (refresh, preuve 2FA) sont en cookies HttpOnly posés par
# l'API : un script ne peut pas les lire. À ajuster si une source externe est ajoutée.
# Les portails et l'API doivent rester sur le même site (*.xlcab.com) : les
# cookies sont en SameSite=Strict.

# HTTPS strict pendant 2 ans, sous-domaines compris.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.xlcab.com wss://api.xlcab.com; frame-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# index.html ne doit pas rester en cache (une mise à jour de sécurité doit être
# prise en compte immédiatement). Attention : un `add_header` dans un bloc
# `location` ANNULE ceux du bloc parent. Dans ce cas, inclure à nouveau ce
# fichier dans le bloc location avant d'ajouter :
#     location = /index.html { include /etc/nginx/snippets/xlcab-security-headers.conf; add_header Cache-Control "no-store" always; }

# TLS 1.3 uniquement (Partie 8), dans le bloc server :
#     ssl_protocols TLSv1.3;
